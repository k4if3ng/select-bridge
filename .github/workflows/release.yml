name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run TypeScript tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  windows:
    name: Build Windows ${{ matrix.arch }} release
    needs: test
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Verify Node.js architecture
        shell: pwsh
        run: |
          $expected = '${{ matrix.arch }}'
          $actual = node -p "process.arch"
          if ($actual -ne $expected) {
            throw "Expected Node.js architecture '$expected', got '$actual'."
          }

      - name: Validate tag and package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' must use the vMAJOR.MINOR.PATCH format."
          }

          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $Matches.version) {
            throw "package.json version '$packageVersion' does not match tag '$tag'."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Setup and Portable packages
        shell: pwsh
        run: pnpm build:windows

      - name: Upload Windows ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: select-bridge-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish Windows release
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp {} release/ \;

          count=$(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected four Windows release files, found $count."
            find release -maxdepth 1 -type f -print
            exit 1
          fi

          (
            cd release
            sha256sum *.exe *.zip | sort -k2 > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
